[workspace]
resolver = "3"
members = [
    "crates/rustforms",
    "crates/rustforms-macros",
    "crates/rustforms-model",
    "crates/rustforms-designer",
    "examples/hello",
    "examples/custom",
    "examples/dialogs",
]

[workspace.package]
version = "0.12.0"
edition = "2024"

# Без оптимизации зависимостей отрисовка в отладочной сборке заметно тормозит.
[profile.dev.package."*"]
opt-level = 2
