[package]
name = "rustforms-designer"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
eframe = "0.37.0"
rfd = "0.18.0"
rustforms = { version = "0.12.0", path = "../rustforms" }
rustforms-model = { path = "../rustforms-model" }
